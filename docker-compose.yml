services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: latex_renderer_app
    ports:
      - "5000:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: ${ConnectionStrings__DefaultConnection}
      Minio__Endpoint: ${Minio__Endpoint}
      Minio__AccessKey: ${Minio__AccessKey}
      Minio__SecretKey: ${Minio__SecretKey}
      Redis__ConnectionString: ${Redis__ConnectionString}
      Authentication__Google__ClientId: ${Authentication__Google__ClientId}
      Authentication__Google__ClientSecret: ${Authentication__Google__ClientSecret}
      Authentication__GitHub__ClientId: ${Authentication__GitHub__ClientId}
      Authentication__GitHub__ClientSecret: ${Authentication__GitHub__ClientSecret}
      Storage__Provider: ${Storage__Provider}
      Storage__LocalRootPath: ${Storage__LocalRootPath}
      Storage__S3Bucket: ${Storage__S3Bucket}
      Storage__S3ServiceUrl: ${Storage__S3ServiceUrl}
      Storage__S3AccessKey: ${Storage__S3AccessKey}
      Storage__S3SecretKey: ${Storage__S3SecretKey}
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      redis:
        condition: service_started

  postgres:
    image: postgres:16-alpine
    container_name: latex_renderer_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: latex_renderer_minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio-init:
    image: minio/mc:latest
    container_name: latex_renderer_minio_init
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"
        mc mb --ignore-existing "local/$${STORAGE_BUCKET}"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      STORAGE_BUCKET: ${Storage__S3Bucket}
    depends_on:
      minio:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    container_name: latex_renderer_redis
    ports:
      - "6379:6379"

volumes:
  postgres_data:
  minio_data:
